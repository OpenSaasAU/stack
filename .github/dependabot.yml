version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      # The AWS SDK v3 packages are released in lockstep and share internal
      # @aws-sdk/* and @smithy/* dependencies. Bumped individually they resolve
      # to mismatched versions of those shared packages, which breaks the
      # storage-s3 build. Keep them in one PR.
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
          - '@smithy/*'

      # The Prisma CLI, client, and driver adapters are released in lockstep and
      # expect matching versions of each other. Bumped individually they resolve
      # to mismatched versions across the workspace, which breaks generate and
      # the example builds. Keep them in one PR.
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'

      # @vitest/* packages peer-depend on the exact matching vitest version.
      # Bumped individually they install a second vitest copy and suites fail.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'

      # @ai-sdk/* providers and ai share @ai-sdk/provider. Bumped individually
      # they resolve different provider versions and the model types stop lining up.
      ai-sdk:
        patterns:
          - 'ai'
          - '@ai-sdk/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
