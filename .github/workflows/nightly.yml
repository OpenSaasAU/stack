name: Nightly

# Heavier / networked checks deliberately kept OFF the PR gate (see ADR-0002).
# These run on a schedule and on manual dispatch only — never on pull_request or
# push — so PR feedback stays fast and isn't gated on registry/network state.
on:
  schedule:
    # 03:17 UTC daily. Off-the-hour to avoid the top-of-hour scheduler backlog.
    - cron: '17 3 * * *'
  workflow_dispatch: {}

# Only one nightly run at a time; let a manual dispatch supersede a scheduled one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # (a) The PUBLISHED `npm create opensaas-app` end-to-end: a real networked
  # install of the package from npm, then the documented first-run flow
  # (generate → db:push → build) in a clean temp dir. This is the true e2e the
  # PR-gate scaffold guard only proxies (the guard borrows the workspace
  # toolchain offline; this exercises the actual published artifact). See ADR-0002.
  published-create-e2e:
    name: Published npm create e2e
    # The published package is `main`'s Prisma 7 scaffold. The integration
    # branch's cold start is the `cold-clone` job below instead.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # This job deliberately scaffolds outside the workspace, so it needs no
      # repo checkout of its own — but `pnpm/action-setup` resolves the pnpm
      # version from the workspace `package.json`'s `packageManager`, and with
      # nothing checked out it fails with "No pnpm version is specified".
      # Sparse-check-out just that file: it keeps the runner's pnpm in lockstep
      # with the repo (a pinned `version:` here would silently drift), and the
      # scaffold below still runs in a temp dir against the PUBLISHED package.
      - name: Check out package.json for the pnpm version
        uses: actions/checkout@v7
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Scaffold the published basic (SQLite, no-auth) template fully
      # non-interactively into an OS temp dir — never the runner's workspace —
      # so a mid-run failure can't dirty anything. `--no-ai` skips the networked
      # MCP install; we let the CLI run its own install → generate → db:push.
      - name: Scaffold published create-opensaas-app into a temp dir
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          echo "WORKDIR=$WORKDIR" >> "$GITHUB_ENV"
          cd "$WORKDIR"
          # Real, networked install of the published package + its template deps.
          npx --yes create-opensaas-app@latest myapp --no-auth --no-ai
        env:
          DATABASE_URL: 'file:./dev.db'

      # The CLI auto-runs install → generate → db:push; re-run them explicitly so
      # the job fails loudly (and points at the failed step) if any regress, then
      # exercise a full production build of the scaffolded app.
      - name: Generate, db:push and build the scaffolded app
        run: |
          set -euo pipefail
          cd "$WORKDIR/myapp"
          pnpm install
          pnpm generate
          pnpm db:push
          pnpm build
          test -f .opensaas/context.ts
          test -f dev.db
        env:
          DATABASE_URL: 'file:./dev.db'

  # (b) The FULL `examples/*` build. Examples are off the default build gate
  # (ADR-0002 / PR #447) because each needs a developer-created `.env` to
  # `generate`. This job makes that deterministic: it creates every example's
  # `.env` from its committed `.env.example` first, then runs `pnpm build:examples`.
  # Each `.env.example` now defaults to a DATABASE_URL that matches its config's
  # provider (#462), so no per-example overrides are needed here.
  examples-build:
    name: Full examples build
    # The examples cannot build on the integration branch until they are
    # converted (#1121, build spec 9).
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      # Build the publishable packages first so each example's `opensaas generate`
      # and `next build` resolve against fresh workspace `dist` output.
      - name: Build packages
        run: pnpm build

      # Create a runnable `.env` for every example by copying its committed
      # `.env.example`. Each `.env.example` defaults DATABASE_URL to a value that
      # matches its config's Prisma provider (#462), so no per-example overrides
      # are needed. Other DB/secret placeholders come from the .env.example values
      # plus the job-level env below.
      - name: Create .env for every example
        run: |
          set -euo pipefail
          for dir in examples/*/; do
            name="$(basename "$dir")"
            if [ -f "$dir/.env.example" ]; then
              cp "$dir/.env.example" "$dir/.env"
              echo "prepared .env for $name"
            fi
          done

      - name: Build all examples
        run: pnpm build:examples
        env:
          # SQLite by default; the postgres-provider example (rag-openai-chatbot)
          # keeps its own placeholder URL and never connects during generate/build.
          DATABASE_URL: 'file:./dev.db'
          # Placeholder secrets so generate/build don't fail on missing vars.
          OPENAI_API_KEY: 'sk-testing-key'
          BETTER_AUTH_SECRET: 'secret-for-testing-in-github-actions-with-numbers1234'
          BETTER_AUTH_URL: 'http://localhost:3000'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'

  # (c) The COLD CLONE: `create` then `dev` on a runner with no database
  # installed. This is the one place CI exercises the Dev database sidecar, and
  # that is its whole purpose (ADR-0063) — so this job deliberately sets no
  # `DATABASE_URL`. Setting one is the Database escape and no Dev database
  # would start, which is precisely the property under test.
  #
  # The scaffolded project borrows `examples/starter`'s installed
  # `node_modules` rather than installing from the registry, the same trick the
  # PR-gate scaffold guard uses: the integration branch's packages are not
  # published, so the workspace is the only source of the toolchain.
  cold-clone:
    name: Cold clone — create then dev
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Build packages
        run: >
          turbo run build
          --filter=@opensaas/stack-core
          --filter=@opensaas/stack-auth
          --filter=@opensaas/stack-ui
          --filter=@opensaas/stack-cli
          --filter=create-opensaas-app

      - name: Scaffold a project outside the workspace
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          echo "COLD_CLONE_DIR=$WORKDIR" >> "$GITHUB_ENV"
          cd "$WORKDIR"
          node "$GITHUB_WORKSPACE/packages/create-opensaas-app/dist/index.js" \
            myapp --no-auth --no-ai --no-install
          ln -s "$GITHUB_WORKSPACE/examples/starter/node_modules" "$WORKDIR/myapp/node_modules"

      - name: Run the dev loop and serve the app
        run: |
          set -euo pipefail
          cd "$COLD_CLONE_DIR/myapp"
          node "$GITHUB_WORKSPACE/packages/cli/bin/opensaas.js" dev > dev.log 2>&1 &
          DEV_PID=$!
          for _ in $(seq 1 120); do
            if curl -sf http://localhost:3000 > /dev/null; then break; fi
            if ! kill -0 "$DEV_PID" 2> /dev/null; then
              echo '`opensaas dev` exited before the app answered:'
              cat dev.log
              exit 1
            fi
            sleep 2
          done
          curl -sf http://localhost:3000 > /dev/null
          test -f .opensaas/dev-db.json
          kill "$DEV_PID"

      - name: Upload the dev loop's output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cold-clone-dev-log
          path: ${{ env.COLD_CLONE_DIR }}/myapp/dev.log
          retention-days: 7
          if-no-files-found: ignore
