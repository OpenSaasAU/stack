name: Test

on:
  pull_request:
    branches: [main, prisma-8]

# Cancel any in-progress run for the same PR/branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # The escape belongs to the job, not to the steps that happen to need it: a
    # suite whose guarantee PGlite cannot exercise skips itself by name when the
    # variable is absent, and a skip that reads as coverage is what this guards
    # against (ADR-0063). PRs into `main` keep the SQLite string that branch
    # still uses; the integration branch names the service container below.
    #
    # Setting it here is necessary but not sufficient: turbo's strict env mode
    # (the default since 2.x) strips any variable a task does not declare, so
    # every task that dials the escape must also list `DATABASE_URL` under
    # `env` in turbo.json. `test` did not, and silently ran on PGlite while
    # `test:coverage` ran on the container beside it.
    env:
      DATABASE_URL: ${{ github.base_ref == 'main' && 'file:./dev.db' || 'postgres://postgres:postgres@localhost:5432/postgres' }}

    # The real Postgres the test harness runs against on the integration branch
    # (ADR-0057's `DATABASE_URL` escape, #1143). pgvector's image rather than
    # the plain one, so a pack-declaring contract's `CREATE EXTENSION vector`
    # has something to install — ADR-0065 makes provisioning the deployment's
    # job, and CI is a deployment. PRs into `main` point the job's DATABASE_URL
    # at SQLite instead, so this container simply goes unused there.
    services:
      postgres:
        # Pinned by digest: `pg17` is a mutable tag, and an upstream retag
        # would change CI's database with no commit here. Resolved from
        # pgvector/pgvector:pg17 on 2026-09-06; bump both together.
        image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Ensure package version consistency
        run: pnpm manypkg check

      # Runs against the PR's merge commit (actions/checkout's default ref for
      # pull_request events), which is the only place a two-branch numbering
      # collision becomes visible — each branch is self-consistent on its own.
      - name: Check for duplicate ADR numbers
        run: pnpm check:adr-duplicates

      - name: Check for Prisma error-code literals
        run: pnpm check:prisma-error-codes

      - name: Lint codebase
        run: pnpm lint

      - name: Check format
        run: pnpm format:check

      # `opensaas generate` must be deterministic: re-running it over a
      # committed project leaves contract.ts, prisma.config.ts, contract.json,
      # contract.d.ts and the seeded extension contract space under migrations/
      # byte-identical. The contract fixture covers the constructs whose
      # emission is easiest to make unstable; the two converted examples cover
      # what the scaffolder ships (ADR-0067). The other ten examples join this
      # gate as each converts (#1129, wave 2).
      # `opensaas generate` loads each example's config, so every package that
      # config imports has to be built — turbo's `build` is `dependsOn:
      # ["^build"]`, which reaches a package's own dependencies and not the
      # examples'. Naming each example's closure builds whatever a newly
      # imported package turns out to be, rather than turning this step red a
      # wave later. `^...` is the dependency operator only on a package NAME;
      # against a path filter it selects the example itself as well.
      - name: Build the CLI and the examples' dependencies for the regeneration gate
        run: >
          turbo run build
          --filter=@opensaas/stack-cli
          --filter=opensaas-starter-example^...
          --filter=opensaas-starter-auth-example^...
          --filter=opensaas-custom-field-example^...
          --filter=opensaas-blog-example^...

      - name: Regenerate the contract fixture
        run: node ../../../bin/opensaas.js generate
        working-directory: ./packages/cli/tests/fixtures/contract-project

      - name: Regenerate examples/starter
        run: node ../../packages/cli/bin/opensaas.js generate
        working-directory: ./examples/starter

      - name: Regenerate examples/starter-auth
        run: node ../../packages/cli/bin/opensaas.js generate
        working-directory: ./examples/starter-auth

      - name: Regenerate examples/custom-field
        run: node ../../packages/cli/bin/opensaas.js generate
        working-directory: ./examples/custom-field

      - name: Regenerate examples/blog
        run: node ../../packages/cli/bin/opensaas.js generate
        working-directory: ./examples/blog

      # `git add --intent-to-add` first: a plain `git diff` only sees tracked
      # files, so a newly emitted artifact would land untracked and pass green.
      # Ignored paths (the `.opensaas` bundle) stay ignored.
      - name: Fail on a dirty regeneration
        run: |
          git add --intent-to-add -- packages/cli/tests/fixtures/contract-project examples/starter examples/starter-auth examples/custom-field examples/blog
          git diff --exit-code -- packages/cli/tests/fixtures/contract-project examples/starter examples/starter-auth examples/custom-field examples/blog

      # Unlike its two sibling checks above, this one reads compiled output: it
      # resolves @opensaas/* through each package's own `exports` to its dist,
      # so it measures this branch's own declarations. The regeneration step
      # above builds the CLI and the two examples' dependency closures, so the
      # packages the doc blocks import beyond those are built here. turbo
      # caches it, and the test steps below depend on the same task, so this is
      # a reordering rather than an extra build.
      #
      # THE GATE. PRs into `main` are excluded because the fixtures cannot
      # describe that tree: `files.txt` names this branch's documents and
      # `fragments.json` keys entries by `file:line`, so against main's RAG
      # documents every entry would report as orphaned. Unlike the test steps
      # below, the exclusion has no `== 'main'` run counterpart, so it cannot
      # expire on its own: once prisma-8 lands, base_ref is always 'main' and
      # the check would stop running for good. Flipping it is part of that
      # merge — drop the `!= 'main'` gates on the steps below, delete the
      # notice step, and re-key scripts/doc-blocks/fragments.json against
      # main's documents. Tracked on #1301. Every other mention of the flip
      # points here.
      - name: Build packages for the doc-block check
        if: github.base_ref != 'main'
        run: turbo run build --filter='./packages/*'

      # The checker's own fixture of known-bad and known-good blocks: every bad
      # block must be reported FAIL and every good one must pass, before the
      # real documents are trusted to a run of it.
      - name: Self-test the doc-block checker
        if: github.base_ref != 'main'
        run: node scripts/check-doc-typescript-blocks.mjs --self-test

      - name: Check documented TypeScript blocks compile
        if: github.base_ref != 'main'
        run: pnpm check:doc-ts-blocks

      # The counterpart the skip above would otherwise lack. It does not run
      # the check — it makes the gap visible on every PR into main, so the
      # flip is prompted by CI rather than remembered.
      - name: Note the skipped doc-block check
        if: github.base_ref == 'main'
        run: |
          echo "::warning title=Doc-block typecheck did not run::pnpm check:doc-ts-blocks runs on PRs into prisma-8 only. The instruction for flipping that gate is the comment above it in .github/workflows/test.yml (#1301)."

      - name: Run tests
        if: github.base_ref == 'main'
        run: turbo run test
        env:
          OPENAI_API_KEY: 'sk-testing-key'

      # turbo's `test` task depends on `build`, so an unfiltered run also builds
      # every examples/* package. On the prisma-8 integration branch only
      # `starter` and `starter-auth` are converted (#1170); the other ten cannot
      # build until wave 2 of #1129 converts them, and #1175 lifts this filter
      # to the unfiltered run above once they have.
      - name: Run package tests and build the converted examples (integration branch)
        if: github.base_ref != 'main'
        run: >
          turbo run test
          --filter='./packages/*'
          --filter=./examples/starter
          --filter=./examples/starter-auth
          --filter=./examples/custom-field
          --filter=./examples/blog
        env:
          OPENAI_API_KEY: 'sk-testing-key'
          BETTER_AUTH_SECRET: 'secret-for-testing-in-github-actions-with-numbers1234'
          BETTER_AUTH_URL: 'http://localhost:3000'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'

      - name: Run tests with coverage
        if: github.base_ref == 'main'
        run: turbo run test:coverage
        env:
          OPENAI_API_KEY: 'sk-testing-key'

      # Coverage is a package property; the examples carry no `test:coverage`.
      - name: Run package tests with coverage (integration branch)
        if: github.base_ref != 'main'
        run: turbo run test:coverage --filter='./packages/*'
        env:
          OPENAI_API_KEY: 'sk-testing-key'

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright

      - name: Run browser tests with coverage
        working-directory: ./packages/ui
        run: pnpm test:browser:coverage

      - name: Upload coverage artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
          retention-days: 1

      - name: Upload browser test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-screenshots
          path: packages/ui/tests/browser/**/__screenshots__/
          retention-days: 7

  # Every guard and the Playwright run below stands on `examples/starter-auth`
  # and the scaffold built from `examples/starter`, both on Prisma 8 (#1170).
  #
  # The job runs twice, and the two legs differ in exactly one variable. On the
  # `dev-database` leg no `DATABASE_URL` is set: the Playwright harness and the
  # auth guards call the same lookup the app does, and with nothing set they
  # start the Dev database in-process (ADR-0063) — naming a URL would take the
  # escape branch and the sidecar this leg exists to exercise would never
  # start. On the `postgres` leg the variable names the service container
  # below, which is story 25 of #1125: the same suites on the parity server CI
  # keeps for production's sake. Services are job-scoped, so the container is
  # started for both legs and only the `postgres` leg dials it.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        database: [dev-database, postgres]
        include:
          - database: dev-database
            database_url: ''
          - database: postgres
            database_url: 'postgres://postgres:postgres@localhost:5432/postgres'

    env:
      BETTER_AUTH_URL: 'http://localhost:3000'
      BETTER_AUTH_SECRET: 'secret-for-teating-in-github-actions-with-numbers1234'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
      # The lookup treats an empty variable as absent, so the dev-database leg
      # still starts the sidecar.
      DATABASE_URL: ${{ matrix.database_url }}

    # Pinned by the same digest as the `test` job's; bump both together.
    services:
      postgres:
        image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Build packages
        run: >
          turbo run build
          --filter=@opensaas/stack-core
          --filter=@opensaas/stack-auth
          --filter=@opensaas/stack-ui
          --filter=@opensaas/stack-cli
          --filter=create-opensaas-app

      # Isolated first-run guard: scaffold the real CLI into an OS temp dir and
      # run generate against the workspace toolchain (no network install, no
      # database — the first `pnpm dev` brings one up). Opt-in via
      # RUN_SCAFFOLD_GUARD so it stays out of the fast unit lane. See ADR-0002
      # and packages/create-opensaas-app/tests/scaffold-first-run-guard.test.ts.
      - name: Run scaffold first-run guard
        run: pnpm --filter create-opensaas-app test run scaffold-first-run-guard
        env:
          RUN_SCAFFOLD_GUARD: '1'

      # Live proof the database-backed rate limiter (issue #909) actually
      # works: generates a real contract with the derived RateLimit list,
      # applies it to a real Postgres (this leg's), and drives real
      # betterAuth() instances through it. Borrows the same offline toolchain
      # as the scaffold guard above, so it needs no additional install. Opt-in
      # via RUN_RATE_LIMIT_E2E so it stays out of the fast unit lane. See
      # ADR-0002 and packages/auth/tests/rate-limit-e2e.test.ts.
      - name: Run database-backed rate limiter e2e guard
        run: pnpm --filter @opensaas/stack-auth test rate-limit-e2e
        env:
          RUN_RATE_LIMIT_E2E: '1'

      # Live proof that deleting a user via better-auth's own /delete-user
      # cascades through the MCP plugin's OAuth tables (issue #992) instead of
      # orphaning them. Same offline toolchain/pattern as the guards above.
      # Opt-in via RUN_MCP_OAUTH_CASCADE_E2E. See packages/auth/tests/mcp-oauth-cascade-e2e.test.ts.
      - name: Run MCP OAuth cascade-on-delete e2e guard
        run: pnpm --filter @opensaas/stack-auth test mcp-oauth-cascade-e2e
        env:
          RUN_MCP_OAUTH_CASCADE_E2E: '1'

      # Live proof that the derived auth lists' credential-bearing fields
      # (Session.token, Verification.value, Account.password/accessToken/
      # refreshToken/idToken) are stripped from an opened context.db read,
      # remain readable under sudo(), and that sign-up/sign-in/session-refresh/
      # password-reset are unaffected (issue #981, ADR-0036). Same offline
      # toolchain/pattern as the guards above. Opt-in via
      # RUN_CREDENTIAL_DENY_E2E. See
      # packages/auth/tests/credential-field-read-deny-e2e.test.ts.
      - name: Run credential-field read-deny e2e guard
        run: pnpm --filter @opensaas/stack-auth test credential-field-read-deny-e2e
        env:
          RUN_CREDENTIAL_DENY_E2E: '1'

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright

      # Cache the starter-auth Next.js build that Playwright's webServer compiles,
      # so the production build is incremental instead of a full ~3 min build each run.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: examples/starter-auth/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('examples/starter-auth/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true

      # The harness reconciled the example's database, which rewrites the
      # committed `db` ref and snapshot under migrations/ (ADR-0065, ADR-0067).
      # A diff here means the committed ref describes a contract the config no
      # longer derives.
      - name: Fail on a stale committed migrations directory
        run: |
          git add --intent-to-add -- examples/starter-auth/migrations
          git diff --exit-code -- examples/starter-auth/migrations

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.database }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.database }}
          path: test-results/
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: packages/

      - name: Report coverage for Core Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/core
          name: 'Core Package Coverage'

      - name: Report coverage for UI Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/ui
          name: 'UI Package Coverage'

      - name: Report coverage for CLI Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/cli
          name: 'CLI Package Coverage'

      - name: Report coverage for Auth Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/auth
          name: 'Auth Package Coverage'

      - name: Report coverage for Storage Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/storage
          name: 'Storage Package Coverage'

      - name: Report coverage for RAG Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/rag
          name: 'RAG Package Coverage'

      - name: Report coverage for Storage S3 Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/storage-s3
          name: 'Storage S3 Package Coverage'

      - name: Report coverage for Storage Vercel Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/storage-vercel
          name: 'Storage Vercel Package Coverage'
