name: Test

on:
  pull_request:
    branches: [main, prisma-8]

# Cancel any in-progress run for the same PR/branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Ensure package version consistency
        run: pnpm manypkg check

      # Runs against the PR's merge commit (actions/checkout's default ref for
      # pull_request events), which is the only place a two-branch numbering
      # collision becomes visible — each branch is self-consistent on its own.
      - name: Check for duplicate ADR numbers
        run: pnpm check:adr-duplicates

      - name: Check for Prisma error-code literals
        run: pnpm check:prisma-error-codes

      - name: Lint codebase
        run: pnpm lint

      - name: Check format
        run: pnpm format:check

      # `opensaas generate` must be deterministic: re-running it over a
      # committed fixture project leaves contract.ts, prisma.config.ts,
      # contract.json, contract.d.ts and the seeded extension contract space
      # under migrations/ byte-identical. The examples cannot
      # build on the integration branch (#1121, build spec 9), so this fixture
      # stands in for them until they convert.
      - name: Build the CLI for the contract fixture
        run: turbo run build --filter=@opensaas/stack-cli

      - name: Regenerate the contract fixture
        run: node ../../../bin/opensaas.js generate
        working-directory: ./packages/cli/tests/fixtures/contract-project

      # `git add --intent-to-add` first: a plain `git diff` only sees tracked
      # files, so a newly emitted artifact would land untracked and pass green.
      # Ignored paths (the `.opensaas` bundle) stay ignored.
      - name: Fail on a dirty contract fixture
        run: |
          git add --intent-to-add -- packages/cli/tests/fixtures/contract-project
          git diff --exit-code -- packages/cli/tests/fixtures/contract-project

      - name: Run tests
        if: github.base_ref == 'main'
        run: turbo run test
        env:
          OPENAI_API_KEY: 'sk-testing-key'
          DATABASE_URL: 'file:./dev.db'

      # turbo's `test` task depends on `build`, so an unfiltered run also builds
      # every examples/* package. On the prisma-8 integration branch the
      # examples cannot build until they are converted (#1121, build spec 9),
      # so PRs into any base other than main run the published packages only.
      #
      # These two steps deliberately omit the `DATABASE_URL: 'file:./dev.db'`
      # their `main` counterparts above still set: SQLite was removed from the
      # integration branch in #1130, and a set-but-unusable connection string is
      # read by `resolveDatabaseUrl` as a real database the suite should dial.
      # A Postgres for CI arrives with the test harness (#1143, spec #1122).
      - name: Run package tests (integration branch — examples convert in spec 9)
        if: github.base_ref != 'main'
        run: turbo run test --filter='./packages/*'
        env:
          OPENAI_API_KEY: 'sk-testing-key'

      - name: Run tests with coverage
        if: github.base_ref == 'main'
        run: turbo run test:coverage
        env:
          OPENAI_API_KEY: 'sk-testing-key'
          DATABASE_URL: 'file:./dev.db'

      - name: Run package tests with coverage (integration branch — examples convert in spec 9)
        if: github.base_ref != 'main'
        run: turbo run test:coverage --filter='./packages/*'
        env:
          OPENAI_API_KEY: 'sk-testing-key'

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright

      - name: Run browser tests with coverage
        working-directory: ./packages/ui
        run: pnpm test:browser:coverage

      - name: Upload coverage artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
          retention-days: 1

      - name: Upload browser test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-screenshots
          path: packages/ui/tests/browser/**/__screenshots__/
          retention-days: 7

  # Every guard and the Playwright run below stands on the SQLite examples and
  # the Prisma 7 scaffold, which the prisma-8 branch has dropped and cannot
  # rebuild until its examples are converted (#1121, build spec 9). Until then
  # this job runs only for PRs into main.
  e2e:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Build packages
        run: >
          turbo run build
          --filter=@opensaas/stack-core
          --filter=@opensaas/stack-auth
          --filter=@opensaas/stack-ui
          --filter=@opensaas/stack-cli
          --filter=create-opensaas-app

      # Isolated first-run guard: scaffold the real CLI into an OS temp dir and
      # run generate + db:push against the workspace toolchain (no network
      # install). Opt-in via RUN_SCAFFOLD_GUARD so it stays out of the fast unit
      # lane. See ADR-0002 and packages/create-opensaas-app/tests/scaffold-first-run-guard.test.ts.
      - name: Run scaffold first-run guard
        run: pnpm --filter create-opensaas-app test run scaffold-first-run-guard
        env:
          RUN_SCAFFOLD_GUARD: '1'
          DATABASE_URL: 'file:./dev.db'

      # Live proof the database-backed rate limiter (issue #909) actually
      # works: generates a real schema with the derived RateLimit list,
      # pushes it to a real SQLite database, and drives real betterAuth()
      # instances through it. Borrows the same offline toolchain as the
      # scaffold guard above, so it needs no additional install. Opt-in via
      # RUN_RATE_LIMIT_E2E so it stays out of the fast unit lane. See
      # ADR-0002 and packages/auth/tests/rate-limit-e2e.test.ts.
      - name: Run database-backed rate limiter e2e guard
        run: pnpm --filter @opensaas/stack-auth test rate-limit-e2e
        env:
          RUN_RATE_LIMIT_E2E: '1'

      # Live proof that deleting a user via better-auth's own /delete-user
      # cascades through the MCP plugin's OAuth tables (issue #992) instead of
      # orphaning them. Same offline toolchain/pattern as the guards above.
      # Opt-in via RUN_MCP_OAUTH_CASCADE_E2E. See packages/auth/tests/mcp-oauth-cascade-e2e.test.ts.
      - name: Run MCP OAuth cascade-on-delete e2e guard
        run: pnpm --filter @opensaas/stack-auth test mcp-oauth-cascade-e2e
        env:
          RUN_MCP_OAUTH_CASCADE_E2E: '1'

      # Live proof that the derived auth lists' credential-bearing fields
      # (Session.token, Verification.value, Account.password/accessToken/
      # refreshToken/idToken) are stripped from an opened context.db read,
      # remain readable under sudo(), and that sign-up/sign-in/session-refresh/
      # password-reset are unaffected (issue #981, ADR-0036). Same offline
      # toolchain/pattern as the guards above. Opt-in via
      # RUN_CREDENTIAL_DENY_E2E. See
      # packages/auth/tests/credential-field-read-deny-e2e.test.ts.
      - name: Run credential-field read-deny e2e guard
        run: pnpm --filter @opensaas/stack-auth test credential-field-read-deny-e2e
        env:
          RUN_CREDENTIAL_DENY_E2E: '1'

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright

      # Cache the starter-auth Next.js build that Playwright's webServer compiles,
      # so the production build is incremental instead of a full ~3 min build each run.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: examples/starter-auth/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('examples/starter-auth/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          DATABASE_URL: 'file:./dev.db'
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: 'secret-for-teating-in-github-actions-with-numbers1234'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: packages/

      - name: Report coverage for Core Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/core
          name: 'Core Package Coverage'

      - name: Report coverage for UI Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/ui
          name: 'UI Package Coverage'

      - name: Report coverage for CLI Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/cli
          name: 'CLI Package Coverage'

      - name: Report coverage for Auth Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/auth
          name: 'Auth Package Coverage'

      - name: Report coverage for Storage Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/storage
          name: 'Storage Package Coverage'

      - name: Report coverage for RAG Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/rag
          name: 'RAG Package Coverage'

      - name: Report coverage for Storage S3 Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/storage-s3
          name: 'Storage S3 Package Coverage'

      - name: Report coverage for Storage Vercel Package
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: ./packages/storage-vercel
          name: 'Storage Vercel Package Coverage'
