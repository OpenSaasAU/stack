<style>
/* Layout: the stack's admin shell (nav + main). Tokens are the "modern" preset from packages/ui/src/styles/globals.css. */

  --muted: oklch(0.27 0.02 264); --muted-foreground: oklch(0.68 0.015 264);
  --accent: oklch(0.3 0.03 300); --destructive: oklch(0.62 0.21 27); --destructive-foreground: oklch(0.98 0.003 264);
  --success: oklch(0.72 0.16 150); --warning: oklch(0.78 0.15 75); --border: oklch(0.3 0.02 264);
  --shadow-lg: 0 4px 6px -2px oklch(0 0 0 / 0.3), 0 12px 20px -4px oklch(0 0 0 / 0.4); color-scheme: dark;

  { name: 'My drafts', conds: [mk('author', 'is', ME), mk('status', 'is', 'draft')] },
  { name: 'Needs review', conds: [mk('status', 'is', 'review')] },
  { name: 'Scheduled', conds: [mk('status', 'is', 'scheduled')] },
  { name: 'Needs attention', conds: anyOfThese(mk('status', 'is', 'review'), mk('category', 'empty')) },
  { name: 'Top this year', conds: [mk('status', 'is', 'published'), mk('publishedAt', 'within', 'year'), mk('views', 'gte', '10000')] },
];
const NEXT = {
  draft: [['Submit for review', 'send', 'review'], ['Publish now', 'send', 'published']],
  review: [['Publish now', 'send', 'published'], ['Return to draft', 'edit', 'draft']],
  scheduled: [['Publish now', 'send', 'published'], ['Unschedule', 'cal', 'draft']],
  published: [['Unpublish', 'eye', 'draft'], ['Archive', 'archive', 'archived']],
  archived: [['Restore as draft', 'archive', 'draft']],
};

function App() {
  const [rows, setRows] = useState(seededRows);
  const [conds, setCondsRaw] = useState(() => [mk('status', 'is', 'published'), ...anyOfThese(mk('category', 'anyOf', 'Engineering', 'Product'), mk('featured', 'is', 'true')), mk('views', 'gt', '500')]);
  const [views, setViews] = useState(BUILT_IN_VIEWS);
  const [naming, setNaming] = useState(null);
  const [sort, setSort] = useState({ key: 'publishedAt', dir: 'desc' });
  const [page, setPage] = useState(1);
  const [size, setSize] = useState(15);
  const [cols, setCols] = useState(() => new Set(['title', 'status', 'author', 'category', 'publishedAt', 'views', 'comments']));
  const [compact, setCompact] = useState(false);
  const [sel, setSel] = useState(() => new Set());
  const [menu, setMenu] = useState(null);
  const [peek, setPeek] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [toast, setToast] = useState(null);
  const [busy, setBusy] = useState(false);
  const api = useRef({});

  const setConds = (v) => { setCondsRaw((cs) => normalize(typeof v === 'function' ? v(cs) : v)); setPage(1); setSel(new Set()); };
  const filtered = useMemo(() => rows.filter((r) => matchAll(r, conds)), [rows, conds]);
  const sorted = useMemo(() => {
    const { key, dir } = sort, m = dir === 'asc' ? 1 : -1;
    return [...filtered].sort((a, b) => {
      const x = a[key], y = b[key];
      if (x == null || y == null) return x == null ? (y == null ? 0 : 1) : -1;
      return (typeof x === 'string' ? x.localeCompare(y) : x - y) * m;
    });
  }, [filtered, sort]);
  const pages = Math.max(1, Math.ceil(sorted.length / size));
  const cur = Math.min(page, pages);
  const shown = sorted.slice((cur - 1) * size, cur * size);
  const qs = queryString(conds);
  const activeView = views.find((v) => queryString(v.conds) === qs);
  const condFields = new Set(conds.map((c) => c.field));
  const visible = COLS.filter((c) => cols.has(c.key) || condFields.has(c.key));

  useEffect(() => { setBusy(true); const t = setTimeout(() => setBusy(false), 260); return () => clearTimeout(t); }, [qs, sort.key, sort.dir, cur, size]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 5000); return () => clearTimeout(t); }, [toast]);
  useEffect(() => {
    const k = (e) => { if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !document.querySelector('dialog[open]')) { e.preventDefault(); document.getElementById('qb-input').focus(); } };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, []);

  const patchRows = (ids, patch, msg) => {
    const before = rows;
    setRows((rs) => rs.map((r) => (ids.includes(r.id) ? { ...r, ...patch(r) } : r)));
    setToast({ msg, undo: () => { setRows(before); setToast({ msg: 'Change undone' }); } });
  };
  const moveTo = (ids, status, msg) => patchRows(ids, (r) => ({ status, updatedAt: TODAY, publishedAt: status === 'published' ? r.publishedAt && r.status !== 'scheduled' ? r.publishedAt : TODAY : status === 'draft' ? null : r.publishedAt }), msg);
  const del = (ids, msg) => { setRows((rs) => rs.filter((r) => !ids.includes(r.id))); setSel(new Set()); setToast({ msg }); };
  const askDelete = (ids) => {
    const one = ids.length === 1 && rows.find((r) => r.id === ids[0]);
    setConfirm({ title: one ? 'Delete this post?' : `Delete ${ids.length} posts?`, body: one ? `“${one.title}” will be permanently deleted. This cannot be undone.` : 'These posts will be permanently deleted. This cannot be undone.', label: one ? 'Delete post' : `Delete ${ids.length} posts`, run: () => del(ids, one ? 'Post deleted' : `${ids.length} posts deleted`) });
  };
  const copy = (t, msg) => { const ok = () => setToast({ msg }); navigator.clipboard?.writeText(t).then(ok, () => setToast({ msg: `Copy this: ${t}` })); };
  const rowItems = (r) => [
    { label: 'Quick view', icon: 'eye', run: () => setPeek(r.id) },
    { label: 'Edit', icon: 'edit', run: () => setToast({ msg: `Opens /admin/post/${r.id}` }) },
    { label: 'Duplicate', icon: 'copy', run: () => { setRows((rs) => [{ ...r, id: r.id + '_' + rs.length, title: r.title + ' (copy)', status: 'draft', publishedAt: null, views: 0, comments: 0, featured: false, updatedAt: TODAY }, ...rs]); setToast({ msg: 'Draft copy created' }); } },
    { label: 'Copy link', icon: 'link', run: () => copy(`https://example.com/admin/post/${r.id}`, 'Link copied') },
    '-',
    ...NEXT[r.status].map(([label, icon, to]) => ({ label, icon, run: () => moveTo([r.id], to, `${label}: done for “${r.title.slice(0, 32)}”`) })),
    '-',
    { label: 'Delete', icon: 'trash', danger: true, run: () => askDelete([r.id]) },
  ];
  const sortItems = () => [{ group: 'Sort by' }, ...COLS.filter((c) => c.sortable).map((c) => ({ label: c.label, checked: sort.key === c.key, keepOpen: true, run: () => setSort({ key: c.key, dir: sort.dir }) })), '-', { label: 'Ascending', checked: sort.dir === 'asc', keepOpen: true, run: () => setSort({ ...sort, dir: 'asc' }) }, { label: 'Descending', checked: sort.dir === 'desc', keepOpen: true, run: () => setSort({ ...sort, dir: 'desc' }) }];
  const colItems = () => [{ group: 'Show columns' }, ...COLS.filter((c) => !c.fixed).map((c) => ({ label: c.label + (condFields.has(c.key) && !cols.has(c.key) ? ' (filtered)' : ''), checked: cols.has(c.key) || condFields.has(c.key), keepOpen: true, run: () => setCols((s) => { const n = new Set(s); n.has(c.key) ? n.delete(c.key) : n.add(c.key); return n; }) }))];
  const openMenu = (e, kind, row) => { const anchor = e.currentTarget; setMenu((m) => (m?.anchor === anchor ? null : { anchor, kind, row })); };
  const clickSort = (key) => setSort((s) => (s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' }));
  const hasIs = (f, v) => conds.some((c) => c.field === f && c.op === 'is' && c.values[0] === v);
  const toggleIs = (f, v) => setConds(hasIs(f, v) ? conds.filter((c) => !(c.field === f && c.op === 'is' && c.values[0] === v)) : withCond(conds, mk(f, 'is', v)));
  const relax = useMemo(() => {
    if (filtered.length || !conds.length) return null;
    return units(conds).map((u) => ({ u, n: rows.filter((r) => matchAll(r, conds.filter((o) => !u.includes(o)))).length })).sort((a, b) => b.n - a.n)[0];
  }, [filtered, conds, rows]);
  const pageIds = shown.map((r) => r.id);
  const allOn = pageIds.length > 0 && pageIds.every((id) => sel.has(id));
  const toggleRow = (id) => setSel((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });

  const cell = (r, key) => {
    const v = r[key], empty = html`<span className="muted">—</span>`;
    switch (key) {
      case 'title': return html`<button type="button" className="title-btn" onClick=${() => setPeek(r.id)}>${r.title}</button><span className="sub">/${r.slug.slice(0, 40)}</span>`;
      case 'status': return html`<${StatusPill} value=${v} on=${hasIs('status', v)} onClick=${() => toggleIs('status', v)} />`;
      case 'author': return html`<button type="button" className=${`person ${hasIs('author', v) ? 'on' : ''}`} title=${`Filter to ${v}`} onClick=${() => toggleIs('author', v)}><span className="av">${initials(v)}</span>${v}</button>`;
      case 'category': return v ? html`<button type="button" className=${`plain ${hasIs('category', v) ? 'on' : ''}`} title=${`Filter to ${v}`} onClick=${() => toggleIs('category', v)}>${v}</button>` : empty;
      case 'publishedAt': case 'updatedAt': return v ? html`${fmtDate(v)}<span className="sub">${relDate(v)}</span>` : empty;
      case 'views': return r.status === 'published' || r.status === 'archived' ? html`<span className="num">${fmtNum(v)}</span>` : empty;
      case 'words': return html`<span className="num">${fmtNum(v)}</span>`;
      case 'comments': return v ? html`<span className="num">${v}</span>` : empty;
      case 'featured': return v ? html`<${Icon} n="star" className="star" />` : empty;
    }
  };
  const peeked = peek && rows.find((r) => r.id === peek);
  const selIds = [...sel];

  return html`<div className="shell">
    <nav className="nav" aria-label="Lists">
      <h2>Northline Admin</h2>
      <a href="#"><${Icon} n="home" />Dashboard</a>
      <div className="lbl">Lists</div>
      <a href="#" className="on" aria-current="page"><${Icon} n="list" />Posts</a>
      <a href="#"><${Icon} n="list" />Authors</a>
      <a href="#"><${Icon} n="list" />Categories</a>
      <a href="#"><${Icon} n="list" />Comments</a>
    </nav>
    <main className="main">
      <div className="head">
        <h1>Posts<span className="tag">Prototype, sample data</span></h1>
        <button type="button" className="btn primary" onClick=${() => setToast({ msg: 'Opens /admin/post/create' })}><${Icon} n="plus" />Create post</button>
      </div>

      <div className="views" role="navigation" aria-label="Saved views">
        ${views.map((v) => html`<button type="button" key=${v.name} className="v" aria-current=${activeView === v} onClick=${() => setConds(v.conds.map((c) => ({ ...c })))}>${v.name}<span className="count num">${rows.filter((r) => matchAll(r, v.conds)).length}</span></button>`)}
        ${!activeView && conds.length > 0 && html`<div className="save">${naming === null
          ? html`<button type="button" className="btn ghost" style=${{ height: 30 }} onClick=${() => setNaming('')}><${Icon} n="bookmark" sm />Save view</button>`
          : html`<input id="view-name" autoFocus placeholder="Name this view" aria-label="View name" value=${naming} onChange=${(e) => setNaming(e.target.value)} onBlur=${() => !naming && setNaming(null)} onKeyDown=${(e) => { if (e.key === 'Escape') setNaming(null); if (e.key === 'Enter' && naming.trim()) { setViews([...views, { name: naming.trim(), conds }]); setNaming(null); setToast({ msg: 'View saved' }); } }} />`}</div>`}
      </div>

      <${QueryBar} conds=${conds} setConds=${setConds} api=${api} noun="posts" />

      ${sel.size > 0
        ? html`<div className="bar sel"><b>${sel.size} selected</b><span className="grow"></span>
            <button type="button" className="btn ghost" onClick=${() => { moveTo(selIds, 'published', `${sel.size} posts published`); setSel(new Set()); }}><${Icon} n="send" sm />Publish</button>
            <button type="button" className="btn ghost" onClick=${() => { moveTo(selIds, 'archived', `${sel.size} posts archived`); setSel(new Set()); }}><${Icon} n="archive" sm />Archive</button>
            <button type="button" className="btn ghost" style=${{ color: 'var(--destructive)' }} onClick=${() => askDelete(selIds)}><${Icon} n="trash" sm />Delete</button>
            <button type="button" className="btn ghost" onClick=${() => setSel(new Set())}>Clear</button></div>`
        : html`<div className="bar">
            <span className="grow num" aria-live="polite"><b>${fmtNum(sorted.length)}</b> <span className="muted">${conds.length ? `of ${rows.length} posts` : 'posts'}</span></span>
            <button type="button" className="btn" aria-haspopup="menu" aria-expanded=${menu?.kind === 'sort'} onClick=${(e) => openMenu(e, 'sort')}><${Icon} n="sort" sm />${COLS.find((c) => c.key === sort.key).label}<${Icon} n=${sort.dir === 'asc' ? 'up' : 'down'} sm /></button>
            <button type="button" className="btn" aria-haspopup="menu" aria-expanded=${menu?.kind === 'cols'} onClick=${(e) => openMenu(e, 'cols')}><${Icon} n="columns" sm />Columns</button>
            <div className="seg-toggle" role="group" aria-label="Row density"><button type="button" aria-pressed=${!compact} onClick=${() => setCompact(false)}>Comfortable</button><button type="button" aria-pressed=${compact} onClick=${() => setCompact(true)}>Compact</button></div>
          </div>`}

      <div className="tw">
        ${busy && html`<div className="busy"><i></i></div>`}
        <table className=${compact ? 'compact' : ''}>
          <thead><tr>
            <th className="c-sel"><input type="checkbox" id="sel-all" aria-label="Select all on this page" checked=${allOn} onChange=${() => setSel((s) => { const n = new Set(s); pageIds.forEach((id) => (allOn ? n.delete(id) : n.add(id))); return n; })} /></th>
            ${visible.map((c) => { const on = sort.key === c.key, f = condFields.has(c.key); return html`<th key=${c.key} className=${c.right ? 'right' : ''} aria-sort=${on ? (sort.dir === 'asc' ? 'ascending' : 'descending') : undefined}><span className="h">
              ${c.sortable ? html`<button type="button" className="sort" onClick=${() => clickSort(c.key)}>${c.label}${on && html`<${Icon} n=${sort.dir === 'asc' ? 'up' : 'down'} sm />`}</button>` : c.label}
              <button type="button" className=${`fbtn ${f ? 'on' : ''}`} aria-label=${`Filter by ${c.label}`} title=${`Filter by ${c.label}`} onClick=${() => api.current.startField(c.key)}><${Icon} n="funnel" sm /></button>
            </span></th>`; })}
            <th className="c-act"><span style=${{ position: 'absolute', width: 1, height: 1, overflow: 'hidden' }}>Actions</span></th>
          </tr></thead>
          <tbody>
            ${shown.length === 0 && html`<tr className="none"><td colSpan=${visible.length + 2} style=${{ padding: 0 }}><div className="empty">
              <h3>No posts match these filters</h3>
              ${relax && relax.n > 0 ? html`<p>Removing one filter would bring back ${relax.n} ${relax.n === 1 ? 'post' : 'posts'}.</p><button type="button" className="btn" onClick=${() => setConds(conds.filter((c) => !relax.u.includes(c)))}>Remove “${unitSentence(relax.u)}”</button>` : html`<p>No single filter is responsible. Start again to widen the search.</p><button type="button" className="btn" onClick=${() => setConds([])}>Clear all filters</button>`}
            </div></td></tr>`}
            ${shown.map((r) => html`<tr key=${r.id} className=${sel.has(r.id) ? 'selected' : ''}>
              <td className="c-sel"><input type="checkbox" id=${'s' + r.id} aria-label=${`Select ${r.title}`} checked=${sel.has(r.id)} onChange=${() => toggleRow(r.id)} /></td>
              ${visible.map((c) => html`<td key=${c.key} data-label=${c.label} className=${c.right ? 'right' : ''}>${cell(r, c.key)}</td>`)}
              <td className="c-act"><button type="button" className="icon-btn" aria-label=${`Actions for ${r.title}`} aria-haspopup="menu" aria-expanded=${menu?.row === r} onClick=${(e) => openMenu(e, 'row', r)}><${Icon} n="more" /></button></td>
            </tr>`)}
          </tbody>
        </table>
      </div>

      <div className="pager">
        <span className="num">${sorted.length ? `${(cur - 1) * size + 1}–${Math.min(cur * size, sorted.length)} of ${fmtNum(sorted.length)}` : 'No results'}</span>
        <div className="g">
          <div className="seg-toggle" role="group" aria-label="Rows per page">${[15, 30, 50].map((n) => html`<button type="button" key=${n} aria-pressed=${size === n} onClick=${() => { setSize(n); setPage(1); }}>${n}</button>`)}</div>
          <button type="button" className="btn" disabled=${cur <= 1} onClick=${() => setPage(cur - 1)}>Previous</button>
          <span className="num">Page ${cur} of ${pages}</span>
          <button type="button" className="btn" disabled=${cur >= pages} onClick=${() => setPage(cur + 1)}>Next</button>
        </div>
      </div>

      <section className="notes" aria-label="Prototype notes">
        <div className="q"><h4>Live URL state</h4><code>?search=${allTokens(conds).map((t, i) => html`<span key=${i} className=${t.proposed ? 'prop' : ''}>${i ? ' ' : ''}${t.text}</span>`)}&sort=${sort.key}:${sort.dir}</code></div>
        <div><h4>Works with today's grammar</h4><ul><li>Contains, is, and number or date comparisons</li><li>Between and date presets, written as two AND tokens</li><li>Comments has some or none (a to-many only filters on presence)</li></ul></div>
        <div><h4><span className="legend">Needs a grammar addition</span> (ADR-0017)</h4><ul><li>Is not, doesn't contain, is any of, is empty</li><li>OR groups, written <code style=${{ fontFamily: 'var(--font-mono)' }}>(a OR b)</code>, one level deep. The secured Where vocabulary already takes OR, so only the grammar and its mapper change</li><li>Ranges inside a group, written <code style=${{ fontFamily: 'var(--font-mono)' }}>views:100..500</code></li></ul></div>
        <div><h4>New config or features</h4><ul><li>Per-row actions, alongside <code style=${{ fontFamily: 'var(--font-mono)' }}>bulkActions</code></li><li>Saved views, shown as tabs</li><li>Value suggestions come from config and relationship labels only, never from row data</li></ul></div>
      </section>
    </main>

    ${menu && html`<${Menu} anchor=${menu.anchor} label=${menu.kind === 'row' ? 'Row actions' : menu.kind === 'sort' ? 'Sort' : 'Columns'} items=${menu.kind === 'row' ? rowItems(menu.row) : menu.kind === 'sort' ? sortItems() : colItems()} onClose=${() => setMenu(null)} />`}

    ${peeked && html`<${Modal} className="drawer" label="Post details" onClose=${() => setPeek(null)}>
      <header><h3>${peeked.title}</h3><button type="button" className="icon-btn" aria-label="Close" onClick=${() => setPeek(null)}><${Icon} n="x" /></button></header>
      <dl>
        <dt>Status</dt><dd><${StatusPill} value=${peeked.status} /></dd>
        <dt>Author</dt><dd>${peeked.author}</dd>
        <dt>Category</dt><dd>${peeked.category ?? '—'}</dd>
        <dt>Published</dt><dd>${peeked.publishedAt ? `${fmtDate(peeked.publishedAt)} (${relDate(peeked.publishedAt)})` : '—'}</dd>
        <dt>Views</dt><dd className="num">${fmtNum(peeked.views)}</dd>
        <dt>Comments</dt><dd className="num">${peeked.comments}</dd>
        <dt>Word count</dt><dd className="num">${fmtNum(peeked.words)}</dd>
        <dt>Updated</dt><dd>${fmtDate(peeked.updatedAt)}</dd>
        <dt>Slug</dt><dd style=${{ overflowWrap: 'anywhere' }}>/${peeked.slug}</dd>
      </dl>
      <div className="acts"><button type="button" className="btn primary" onClick=${() => { setPeek(null); setToast({ msg: `Opens /admin/post/${peeked.id}` }); }}>Edit post</button></div>
    <//>`}

    ${confirm && html`<${Modal} className="confirm" label=${confirm.title} onClose=${() => setConfirm(null)}>
      <h3>${confirm.title}</h3><p>${confirm.body}</p>
      <div className="acts"><button type="button" className="btn" autoFocus onClick=${() => setConfirm(null)}>Cancel</button><button type="button" className="btn danger" onClick=${() => { confirm.run(); setConfirm(null); }}>${confirm.label}</button></div>
    <//>`}

    ${toast && html`<div className="toast" role="status"><span>${toast.msg}</span>${toast.undo && html`<button type="button" onClick=${toast.undo}>Undo</button>`}</div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
</script>
